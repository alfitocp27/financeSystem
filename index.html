<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0D11" id="theme-color-meta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SakuMhs" />
    <link rel="manifest" href="/manifest.json" />
    <title>SakuMhs - Finansial Mahasiswa & Safe to Spend</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('sakumhs_theme');
          var isDark = true;
          if (stored === 'light') {
            isDark = false;
          } else if (stored === 'dark') {
            isDark = true;
          } else {
            isDark = !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          var theme = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.classList.toggle('light', !isDark);
          var meta = document.getElementById('theme-color-meta');
          if (meta) meta.setAttribute('content', isDark ? '#0B0D11' : '#F7F5F0');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="font-sans antialiased selection:bg-primary-soft selection:text-text-gold">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
